# Tests : PostgreSQL embarqué (même moteur de base que la production, donc les
# requêtes/Hibernate sont vérifiés contre PostgreSQL et non contre une autre base).
spring:
  datasource:
    url: jdbc:tc:postgresql:16:///serge_immobilier
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: serge
    password: serge123
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: test-secret-key-for-unit-tests-only-1234567890
  expiration-ms: 3600000
