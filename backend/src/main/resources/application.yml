spring:
  application:
    name: serge-immobilier-backend
  config:
    # Charge backend/.env s'il existe (variables DB_URL, JWT_SECRET…).
    # Les variables d'environnement du terminal restent prioritaires.
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/serge_immobilier}
    username: ${DB_USERNAME:serge}
    password: ${DB_PASSWORD:serge123}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
  flyway:
    enabled: true
    # Une base déjà créée par Hibernate (avant Flyway) est marquée comme « de base » :
    # V1 n'est pas rejouée et les migrations suivantes s'appliquent normalement.
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    # SMTP optionnel : s'il est vide, aucun e-mail n'est envoyé (voir PasswordResetMailer).
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    hibernate:
      # Le schéma est géré par Flyway (db/migration) : Hibernate ne fait que vérifier.
      # Mettre DDL_AUTO=update uniquement pour expérimenter en local.
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: true
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  # URL publique du site : utilisée pour les liens d'e-mail et le sitemap.
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  name: Serge Service Immobilier
  admin:
    email: ${ADMIN_EMAIL:admin@serge-immobilier.com}
    password: ${ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:no-reply@sergeserviceimmo.cm}
    # En production, mettre false : le lien n'est jamais renvoyé à l'interface.
    expose-reset-link: ${MAIL_EXPOSE_RESET_LINK:true}
  seo:
    # Code fourni par Google Search Console (méthode « balise HTML »), facultatif.
    google-site-verification: ${GOOGLE_SITE_VERIFICATION:}
  # Code d'accès de l'agence (page /login, champ « Code d'accès ») : permet
  # d'entrer dans l'espace admin sans mot de passe personnel.
  # Laissez vide pour désactiver ce mode.
  setup-code: ${SETUP_CODE:}
  cors:
    # Adresses autorisées en plus de localhost et *.sergeserviceimmo.cm / *.base44.app.
    # Exemple : https://mon-domaine.cm,http://192.168.1.20:5173 (téléphone sur le Wi-Fi)
    allowed-origins: ${ALLOWED_ORIGINS:}
  registration:
    # Désactivé par défaut : seul l'admin crée les comptes. Mettre ALLOW_REGISTRATION=true
    # pour réactiver l'inscription publique (les comptes créés ne peuvent PAS publier).
    enabled: ${ALLOW_REGISTRATION:false}

storage:
  upload-dir: ${UPLOAD_DIR:./uploads}

jwt:
  secret: ${JWT_SECRET:change-me-please-change-this-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.security: INFO
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Sans SMTP configuré, l'indicateur mail fait échouer /actuator/health (DOWN).
    mail:
      enabled: ${SMTP_HEALTH:false}
