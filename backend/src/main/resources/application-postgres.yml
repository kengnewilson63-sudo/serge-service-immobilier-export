# Profil explicite PostgreSQL (identique à la configuration par défaut).
# Lancement : --spring.profiles.active=postgres
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serge_immobilier}
    username: ${DB_USERNAME:serge}
    password: ${DB_PASSWORD:serge123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: INFO
