    <!-- Remplie automatiquement par le serveur avec GOOGLE_SITE_VERIFICATION (backend/.env) ;
         retirée si le code n'est pas configuré, pour ne pas annoncer une balise vide à Google. -->
    <script>
      (function () {
        var code = '%GOOGLE_SITE_VERIFICATION%';
        var tag = document.querySelector('meta[name="google-site-verification"]');
        if (!tag) return;
        if (!code || code.indexOf('%') === 0) tag.remove();
        else tag.setAttribute('content', code);
      })();
    </script>

    <script>
      // Remplace %SITE_URL% par l'URL publique du site. %VITE_SITE_URL% est
      // remplacé au build (Vite) ; sinon on prend l'origine réelle de la page.
      // Placé après les balises concernées : elles existent déjà à l'exécution.
      (function () {
        var origin = '%VITE_SITE_URL%';
        if (!origin || origin.indexOf('VITE_SITE_URL') !== -1) origin = window.location.origin;
        origin = origin.replace(/\/+$/, '');
        document.querySelectorAll('[data-site-url]').forEach(function (el) {
          el.setAttribute('content', el.getAttribute('content').replace(/%SITE_URL%/g, origin));
        });
        document.querySelectorAll('script[type="application/ld+json"]').forEach(function (el) {
          el.text = el.text.replace(/%SITE_URL%/g, origin);
        });
      })();
